<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="title desc">
  <title id="title">Measure interval quantity and quality</title><desc id="desc">From C to E flat, count three letter names inclusively for a third, then count three semitone steps for a minor third.</desc>
  <rect width="840" height="300" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">NAME THE INTERVAL IN TWO STEPS</text>
  <g font-family="Arial,sans-serif"><text x="70" y="90" fill="#b23a26" font-size="15" font-weight="700">1 · QUANTITY</text><text x="70" y="111" fill="#8b8272" font-size="12">count letter names</text><text x="70" y="205" fill="#4e7164" font-size="15" font-weight="700">2 · QUALITY</text><text x="70" y="226" fill="#8b8272" font-size="12">count semitones</text></g>
  <g text-anchor="middle" font-family="Arial,sans-serif" font-weight="700"><circle cx="350" cy="88" r="24" fill="#f1e3d2" stroke="#b23a26" stroke-width="2"/><circle cx="470" cy="88" r="24" fill="#fffdf8" stroke="#d8cebd" stroke-width="2"/><circle cx="590" cy="88" r="24" fill="#f1e3d2" stroke="#b23a26" stroke-width="2"/><text x="350" y="94" fill="#544c40" font-size="18">C</text><text x="470" y="94" fill="#544c40" font-size="18">D</text><text x="590" y="94" fill="#544c40" font-size="18">E♭</text></g>
  <text x="715" y="94" text-anchor="middle" fill="#962e1e" font-family="Arial,sans-serif" font-size="15" font-weight="700">3rd</text>
  <g transform="translate(235 156)" font-family="Arial,sans-serif" text-anchor="middle">
   <g fill="#fffdf8" stroke="#d8cebd" stroke-width="1.5"><rect x="0" y="0" width="72" height="64" rx="7"/><rect x="72" y="0" width="72" height="64" rx="7"/><rect x="144" y="0" width="72" height="64" rx="7"/><rect x="216" y="0" width="72" height="64" rx="7"/><rect x="288" y="0" width="72" height="64" rx="7"/></g>
   <g fill="#b23a26"><rect x="4" y="4" width="64" height="56" rx="5"/><rect x="76" y="4" width="64" height="56" rx="5"/><rect x="148" y="4" width="64" height="56" rx="5"/><rect x="220" y="4" width="64" height="56" rx="5"/></g>
   <g fill="#fffdf8" font-size="14" font-weight="700"><text x="36" y="35">C</text><text x="108" y="35">C♯</text><text x="180" y="35">D</text><text x="252" y="35" font-size="12">E♭/D♯</text></g><text x="324" y="39" fill="#544c40" font-size="15" font-weight="700">E</text>
  </g>
  <text x="420" y="252" text-anchor="middle" fill="#4e7164" font-family="Arial,sans-serif" font-size="15" font-weight="700">3 semitone steps from C to E♭ → minor third (m3)</text><text x="420" y="278" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">Letter count gives the number · semitone count gives the quality</text>
</svg>
