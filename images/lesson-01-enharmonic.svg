<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" role="img" aria-labelledby="title desc">
  <title id="title">C sharp and D flat share one piano key in equal temperament</title>
  <desc id="desc">C sharp and D flat are two spellings for the same black piano key in equal temperament, both corresponding to MIDI note 61.</desc>
  <rect width="840" height="250" rx="18" fill="#fbf7ee"/>
  <text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">TWO SPELLINGS · ONE PITCH (IN EQUAL TEMPERAMENT)</text>
  <g transform="translate(290 58)">
    <rect x="0" y="0" width="130" height="110" rx="5" fill="#fffdf8" stroke="#b9ad98" stroke-width="2"/>
    <rect x="130" y="0" width="130" height="110" rx="5" fill="#fffdf8" stroke="#b9ad98" stroke-width="2"/>
    <rect x="90" y="0" width="80" height="67" rx="0 0 6 6" fill="#28231d"/>
    <text x="65" y="96" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="19" font-weight="700">C</text>
    <text x="195" y="96" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="19" font-weight="700">D</text>
    <text x="130" y="42" text-anchor="middle" fill="#fffdf8" font-family="Arial,sans-serif" font-size="17" font-weight="700">C♯ / D♭</text>
  </g>
  <path d="M420 130V179M420 179H300M420 179H540" fill="none" stroke="#b23a26" stroke-width="2"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="300" y="202" fill="#962e1e" font-size="17" font-weight="700">C♯</text>
    <text x="540" y="202" fill="#962e1e" font-size="17" font-weight="700">D♭</text>
    <text x="420" y="229" fill="#8b8272" font-size="13">Both names point to the same key · MIDI 61</text>
  </g>
</svg>
