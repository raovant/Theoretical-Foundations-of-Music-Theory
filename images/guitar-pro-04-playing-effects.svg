<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" role="img" aria-labelledby="title desc">
 <title id="title">Common guitar articulations in tablature</title><desc id="desc">Examples show hammer-on 5h7, pull-off 7p5, slide 5 slash 7, bend 7b9, vibrato, and palm mute marking.</desc>
 <rect width="840" height="310" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">PLAYING EFFECTS · WRITE HOW THE NOTE IS PLAYED</text>
 <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fffdf8" stroke="#d8cebd" stroke-width="1.5"><rect x="48" y="66" width="230" height="88" rx="12"/><rect x="305" y="66" width="230" height="88" rx="12"/><rect x="562" y="66" width="230" height="88" rx="12"/><rect x="48" y="174" width="230" height="88" rx="12"/><rect x="305" y="174" width="230" height="88" rx="12"/><rect x="562" y="174" width="230" height="88" rx="12"/></g>
 <g fill="#544c40" font-size="13" font-weight="700"><text x="163" y="95">HAMMER-ON</text><text x="420" y="95">PULL-OFF</text><text x="677" y="95">SLIDE</text><text x="163" y="203">BEND</text><text x="420" y="203">VIBRATO</text><text x="677" y="203">PALM MUTE</text></g><g fill="#b23a26" font-size="22" font-weight="700"><text x="163" y="130">5h7</text><text x="420" y="130">7p5</text><text x="677" y="130">5/7</text><text x="163" y="238">7b9</text><text x="420" y="238">~~~~</text><text x="677" y="238">P.M.</text></g></g>
 <text x="420" y="292" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">Select the note first, then apply the matching symbol from the palette or menus.</text>
</svg>
