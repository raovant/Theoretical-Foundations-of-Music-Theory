<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 275" role="img" aria-labelledby="title desc">
 <title id="title">Note durations in four-four time</title><desc id="desc">In four-four time a whole note lasts four beats, a half note two, a quarter one, an eighth half a beat, and a sixteenth a quarter beat.</desc>
 <rect width="840" height="275" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">RHYTHM VALUES · ONE BAR OF 4 / 4</text>
 <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fffdf8" stroke="#d8cebd" stroke-width="1.5"><rect x="55" y="65" width="132" height="132" rx="12"/><rect x="203" y="65" width="132" height="132" rx="12"/><rect x="351" y="65" width="132" height="132" rx="12"/><rect x="499" y="65" width="132" height="132" rx="12"/><rect x="647" y="65" width="132" height="132" rx="12"/></g>
 <g fill="#544c40" font-size="15" font-weight="700"><text x="121" y="111">WHOLE</text><text x="269" y="111">HALF</text><text x="417" y="111">QUARTER</text><text x="565" y="111">EIGHTH</text><text x="713" y="111">16TH</text></g><g fill="#b23a26" font-size="21" font-weight="700"><text x="121" y="148">4</text><text x="269" y="148">2</text><text x="417" y="148">1</text><text x="565" y="148">½</text><text x="713" y="148">¼</text></g><g fill="#8b8272" font-size="11"><text x="121" y="176">beats</text><text x="269" y="176">beats</text><text x="417" y="176">beat</text><text x="565" y="176">beat</text><text x="713" y="176">beat</text></g></g>
 <text x="420" y="231" text-anchor="middle" fill="#4e7164" font-family="Arial,sans-serif" font-size="13" font-weight="700">Shorter values fill the same bar with more note events.</text><text x="420" y="255" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="11">A dotted note adds half of its original duration.</text>
</svg>
