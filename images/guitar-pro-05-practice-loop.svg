 <g fill="#b23a26" font-size="14" font-weight="700"><text x="130" y="218">60%</text><text x="322" y="218">75%</text><text x="514" y="218">90%</text><text x="706" y="218">100%</text></g><path d="M133 236H704" stroke="#d8cebd" stroke-width="3"/><path d="M133 236H706" stroke="#4e7164" stroke-width="2" stroke-dasharray="3 12"/>
 <text x="420" y="270" fill="#8b8272" font-size="12">Raise the speed only after the passage stays clean and relaxed.</text></g>
