<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 285" role="img" aria-labelledby="title desc">
 <title id="title">Practice a selected passage with looping and gradual tempo increases</title><desc id="desc">Select bars, loop the passage, and increase playback speed in stages from 60 to 75 to 90 to 100 percent while keeping the notes accurate.</desc>
 <rect width="840" height="285" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">LOOP A SHORT PASSAGE · INCREASE SPEED IN STEPS</text>
