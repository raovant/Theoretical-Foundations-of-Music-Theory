<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-labelledby="title desc">
 <title id="title">Three forms of the A minor scale</title><desc id="desc">Natural minor uses G; harmonic minor raises G to G sharp; melodic minor raises F to F sharp and G to G sharp when ascending, then returns to natural minor when descending in the classical form.</desc>
 <rect width="840" height="330" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">A MINOR · THREE COMMON FORMS</text>
 <g font-family="Arial,sans-serif"><text x="52" y="89" fill="#544c40" font-size="14" font-weight="700">Natural</text><text x="52" y="155" fill="#544c40" font-size="14" font-weight="700">Harmonic</text><text x="52" y="221" fill="#544c40" font-size="14" font-weight="700">Melodic ↑</text><text x="52" y="287" fill="#544c40" font-size="14" font-weight="700">Melodic ↓</text></g>
 <g font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
  <g fill="#fffdf8" stroke="#d8cebd"><rect x="170" y="61" width="620" height="42" rx="9"/><rect x="170" y="127" width="620" height="42" rx="9"/><rect x="170" y="193" width="620" height="42" rx="9"/><rect x="170" y="259" width="620" height="42" rx="9"/></g>
  <g fill="#544c40"><text x="207" y="88">A</text><text x="286" y="88">B</text><text x="365" y="88">C</text><text x="444" y="88">D</text><text x="523" y="88">E</text><text x="602" y="88">F</text><text x="681" y="88">G</text><text x="760" y="88">A</text>
  <text x="207" y="154">A</text><text x="286" y="154">B</text><text x="365" y="154">C</text><text x="444" y="154">D</text><text x="523" y="154">E</text><text x="602" y="154">F</text><text x="681" y="154" fill="#b23a26">G♯</text><text x="760" y="154">A</text>
  <text x="207" y="220">A</text><text x="286" y="220">B</text><text x="365" y="220">C</text><text x="444" y="220">D</text><text x="523" y="220">E</text><text x="602" y="220" fill="#4e7164">F♯</text><text x="681" y="220" fill="#4e7164">G♯</text><text x="760" y="220">A</text>
  <text x="207" y="286">A</text><text x="286" y="286">G</text><text x="365" y="286">F</text><text x="444" y="286">E</text><text x="523" y="286">D</text><text x="602" y="286">C</text><text x="681" y="286">B</text><text x="760" y="286">A</text></g>
 </g><text x="480" y="319" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="11">Classical melodic minor descends as natural minor; jazz melodic minor keeps the raised 6th and 7th.</text>
</svg>
