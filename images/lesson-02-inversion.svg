<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 255" role="img" aria-labelledby="title desc">
 <title id="title">Interval inversion</title><desc id="desc">Inverting an interval makes its number and quality complement to nine: a major third becomes a minor sixth and a perfect fourth becomes a perfect fifth.</desc>
 <rect width="840" height="255" rx="18" fill="#fbf7ee"/><text x="420" y="35" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">INVERSION: MOVE ONE NOTE BY AN OCTAVE</text>
 <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="75" y="75" width="285" height="125" rx="14" fill="#fffdf8" stroke="#d8cebd"/><rect x="480" y="75" width="285" height="125" rx="14" fill="#fffdf8" stroke="#d8cebd"/>
  <text x="217" y="108" fill="#8b8272" font-size="13">C → E · MAJOR THIRD</text><text x="217" y="148" fill="#b23a26" font-size="24" font-weight="700">M3</text><text x="217" y="178" fill="#544c40" font-size="14">3 + 6 = 9</text>
  <text x="622" y="108" fill="#8b8272" font-size="13">E → C · MINOR SIXTH</text><text x="622" y="148" fill="#4e7164" font-size="24" font-weight="700">m6</text><text x="622" y="178" fill="#544c40" font-size="14">6 + 3 = 9</text>
 </g><path d="M380 135H460" stroke="#b23a26" stroke-width="3"/><path d="m449 127 12 8-12 8" fill="none" stroke="#b23a26" stroke-width="3"/><text x="420" y="232" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="13">Quality pairs: major ↔ minor · perfect ↔ perfect · augmented ↔ diminished</text>
</svg>
