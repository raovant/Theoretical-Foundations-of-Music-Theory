<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
 <title id="title">Basic note entry workflow in Guitar Pro</title><desc id="desc">Select a rhythmic value, click to place the editing cursor, enter a fret number, and move through the score with the arrow keys. R inserts a rest.</desc>
 <rect width="840" height="280" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">ENTER NOTES IN A REPEATABLE ORDER</text>
 <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fffdf8" stroke="#d8cebd" stroke-width="2"><rect x="52" y="75" width="160" height="92" rx="13"/><rect x="245" y="75" width="160" height="92" rx="13"/><rect x="438" y="75" width="160" height="92" rx="13"/><rect x="631" y="75" width="160" height="92" rx="13"/></g><g fill="#b23a26" font-size="13" font-weight="700"><text x="132" y="105">1 · DURATION</text><text x="325" y="105">2 · CURSOR</text><text x="518" y="105">3 · FRET</text><text x="711" y="105">4 · MOVE</text></g><g fill="#544c40" font-size="12"><text x="132" y="135">Choose note value</text><text x="325" y="135">Click a beat</text><text x="518" y="135">Type 0–24</text><text x="711" y="135">Arrow keys</text></g></g>
 <g stroke="#87643c" stroke-width="3" fill="none"><path d="M214 121h25M407 121h25M600 121h25"/><path d="m229 113 11 8-11 8M422 113l11 8-11 8M615 113l11 8-11 8"/></g>
 <rect x="124" y="194" width="592" height="48" rx="10" fill="#e0ebe3"/><text x="420" y="224" text-anchor="middle" fill="#4e7164" font-family="Arial,sans-serif" font-size="14" font-weight="700">R = REST · + / − = CHANGE NOTE DURATION</text>
 <text x="420" y="265" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="11">Clicking positions the cursor; typing the fret inserts the note.</text>
</svg>
