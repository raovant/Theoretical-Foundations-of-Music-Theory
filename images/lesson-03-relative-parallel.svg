<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="title desc">
 <title id="title">Relative and parallel keys compared</title><desc id="desc">C major and A minor are relative keys: same notes, different tonic. C major and C minor are parallel keys: same tonic, different notes.</desc>
 <rect width="840" height="300" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">RELATIVE KEYS ≠ PARALLEL KEYS</text>
 <rect x="45" y="61" width="355" height="195" rx="14" fill="#fffdf8" stroke="#d8cebd"/><rect x="440" y="61" width="355" height="195" rx="14" fill="#fffdf8" stroke="#d8cebd"/>
 <g text-anchor="middle" font-family="Arial,sans-serif"><text x="222" y="93" fill="#b23a26" font-size="17" font-weight="700">RELATIVE · SAME NOTES</text><text x="222" y="135" fill="#544c40" font-size="16" font-weight="700">C major</text><text x="222" y="161" fill="#8b8272" font-size="13">C D E F G A B</text><text x="222" y="197" fill="#544c40" font-size="16" font-weight="700">A minor</text><text x="222" y="223" fill="#8b8272" font-size="13">A B C D E F G</text>
 <text x="617" y="93" fill="#4e7164" font-size="17" font-weight="700">PARALLEL · SAME TONIC</text><text x="617" y="135" fill="#544c40" font-size="16" font-weight="700">C major</text><text x="617" y="161" fill="#8b8272" font-size="13">C D E F G A B</text><text x="617" y="197" fill="#544c40" font-size="16" font-weight="700">C minor</text><text x="617" y="223" fill="#8b8272" font-size="13">C D E♭ F G A♭ B♭</text></g>
 <text x="222" y="278" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">Different tonic · shared key signature</text><text x="617" y="278" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">Same tonic · different notes</text>
</svg>
