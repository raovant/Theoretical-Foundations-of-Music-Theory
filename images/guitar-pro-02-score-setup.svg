<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="title desc">
 <title id="title">Score settings and synchronized notation in Guitar Pro</title><desc id="desc">Set key, time signature, and tempo for a score. Standard notation and tablature display the same notes and stay synchronized.</desc>
 <rect width="840" height="270" rx="18" fill="#fbf7ee"/><text x="420" y="32" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">SET THE SCORE FRAME · THEN CHOOSE HOW TO READ IT</text>
 <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="66" width="210" height="155" rx="13" fill="#fffdf8" stroke="#d8cebd"/><text x="160" y="95" fill="#b23a26" font-size="14" font-weight="700">SCORE SETTINGS</text><text x="160" y="126" fill="#544c40" font-size="13">Key: C major</text><text x="160" y="153" fill="#544c40" font-size="13">Meter: 4 / 4</text><text x="160" y="180" fill="#544c40" font-size="13">Tempo: 90 BPM</text>
 <rect x="310" y="66" width="475" height="155" rx="13" fill="#fffdf8" stroke="#d8cebd"/><text x="548" y="95" fill="#b23a26" font-size="14" font-weight="700">SAME NOTES · TWO NOTATION VIEWS</text><text x="344" y="133" fill="#8b8272" font-size="12">STAFF</text><g stroke="#d8cebd"><path d="M410 119h330M410 129h330M410 139h330M410 149h330M410 159h330"/></g><g fill="#544c40"><ellipse cx="470" cy="159" rx="8" ry="5"/><ellipse cx="535" cy="154" rx="8" ry="5"/><ellipse cx="600" cy="149" rx="8" ry="5"/></g><g fill="#4e7164" font-size="10" font-weight="700"><text x="470" y="179">E4</text><text x="535" y="179">F4</text><text x="600" y="179">G4</text></g><text x="344" y="207" fill="#8b8272" font-size="12">TAB</text><text x="470" y="207" fill="#544c40" font-size="14" font-weight="700">0</text><text x="535" y="207" fill="#544c40" font-size="14" font-weight="700">1</text><text x="600" y="207" fill="#544c40" font-size="14" font-weight="700">3</text><text x="698" y="207" fill="#4e7164" font-size="12">linked</text>
 </g><text x="420" y="250" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">Use the Track Inspector to display tablature, standard notation, or both.</text>
</svg>
