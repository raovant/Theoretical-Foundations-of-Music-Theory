<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" role="img" aria-labelledby="title desc">
  <title id="title">Scientific pitch names and MIDI numbers for one octave</title>
  <desc id="desc">The twelve notes from C4 through B4 map to MIDI numbers 60 through 71. C4 is Middle C at MIDI 60, and A4 is 440 hertz at MIDI 69.</desc>
  <rect width="840" height="250" rx="18" fill="#fbf7ee"/>
  <text x="420" y="35" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">NOTE NAME ↔ MIDI NUMBER</text>
  <text x="70" y="89" fill="#8b8272" font-family="Arial,sans-serif" font-size="13" font-weight="700">SPN</text>
  <text x="70" y="157" fill="#8b8272" font-family="Arial,sans-serif" font-size="13" font-weight="700">MIDI</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#fffdf8" stroke="#d8cebd" stroke-width="1.5">
      <rect x="126" y="60" width="52" height="112" rx="8"/><rect x="180" y="60" width="52" height="112" rx="8"/><rect x="234" y="60" width="52" height="112" rx="8"/><rect x="288" y="60" width="52" height="112" rx="8"/><rect x="342" y="60" width="52" height="112" rx="8"/><rect x="396" y="60" width="52" height="112" rx="8"/><rect x="450" y="60" width="52" height="112" rx="8"/><rect x="504" y="60" width="52" height="112" rx="8"/><rect x="558" y="60" width="52" height="112" rx="8"/><rect x="612" y="60" width="52" height="112" rx="8"/><rect x="666" y="60" width="52" height="112" rx="8"/><rect x="720" y="60" width="52" height="112" rx="8"/>
    </g>
    <rect x="128" y="62" width="48" height="108" rx="6" fill="#f1e3d2" stroke="#b23a26" stroke-width="2"/>
    <rect x="614" y="62" width="48" height="108" rx="6" fill="#e0ebe3" stroke="#4e7164" stroke-width="2"/>
    <g fill="#544c40" font-size="15" font-weight="700">
      <text x="152" y="104">C4</text><text x="206" y="104">C♯4</text><text x="260" y="104">D4</text><text x="314" y="104">D♯4</text><text x="368" y="104">E4</text><text x="422" y="104">F4</text><text x="476" y="104">F♯4</text><text x="530" y="104">G4</text><text x="584" y="104">G♯4</text><text x="638" y="104">A4</text><text x="692" y="104">A♯4</text><text x="746" y="104">B4</text>
    </g>
    <g fill="#8b8272" font-size="13"><text x="152" y="145">60</text><text x="206" y="145">61</text><text x="260" y="145">62</text><text x="314" y="145">63</text><text x="368" y="145">64</text><text x="422" y="145">65</text><text x="476" y="145">66</text><text x="530" y="145">67</text><text x="584" y="145">68</text><text x="638" y="145">69</text><text x="692" y="145">70</text><text x="746" y="145">71</text></g>
  </g>
  <text x="152" y="204" text-anchor="middle" fill="#962e1e" font-family="Arial,sans-serif" font-size="12" font-weight="700">Middle C</text>
  <text x="638" y="204" text-anchor="middle" fill="#4e7164" font-family="Arial,sans-serif" font-size="12" font-weight="700">440 Hz</text>
  <text x="420" y="233" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">Each step is one semitone · next octave begins at C5 / MIDI 72</text>
</svg>
