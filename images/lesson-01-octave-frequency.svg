<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" role="img" aria-labelledby="title desc">
  <title id="title">Frequency doubles at each octave</title>
  <desc id="desc">Across the same time span, A3 makes two cycles, A4 makes four, and A5 makes eight, illustrating the 2 to 1 frequency ratio.</desc>
  <rect width="840" height="250" rx="18" fill="#fbf7ee"/>
  <text x="420" y="30" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">SAME TIME SPAN · FREQUENCY DOUBLES EACH OCTAVE</text>
  <g font-family="Arial,sans-serif">
    <text x="45" y="77" fill="#544c40" font-size="17" font-weight="700">A3</text><text x="45" y="96" fill="#8b8272" font-size="12">220 Hz</text>
    <text x="45" y="145" fill="#544c40" font-size="17" font-weight="700">A4</text><text x="45" y="164" fill="#8b8272" font-size="12">440 Hz</text>
    <text x="45" y="213" fill="#544c40" font-size="17" font-weight="700">A5</text><text x="45" y="232" fill="#8b8272" font-size="12">880 Hz</text>
  </g>
  <g stroke="#ded5c5" stroke-width="1"><path d="M130 65H795M130 133H795M130 201H795"/></g>
  <g fill="none" stroke="#b23a26" stroke-width="3" stroke-linecap="round">
    <path d="M130 65 C171 28 212 28 253 65 S335 102 376 65 S458 28 499 65 S581 102 622 65 S704 28 745 65 S786 102 795 65"/>
  </g>
  <g fill="none" stroke="#87643c" stroke-width="3" stroke-linecap="round">
    <path d="M130 133 C150 96 170 96 190 133 S230 170 250 133 S290 96 310 133 S350 170 370 133 S410 96 430 133 S470 170 490 133 S530 96 550 133 S590 170 610 133 S650 96 670 133 S710 170 730 133 S770 96 790 133"/>
  </g>
  <g fill="none" stroke="#4e7164" stroke-width="3" stroke-linecap="round">
    <path d="M130 201 C140 164 150 164 160 201 S180 238 190 201 S210 164 220 201 S240 238 250 201 S270 164 280 201 S300 238 310 201 S330 164 340 201 S360 238 370 201 S390 164 400 201 S420 238 430 201 S450 164 460 201 S480 238 490 201 S510 164 520 201 S540 238 550 201 S570 164 580 201 S600 238 610 201 S630 164 640 201 S660 238 670 201 S690 164 700 201 S720 238 730 201 S750 164 760 201 S780 238 790 201"/>
  </g>
</svg>
