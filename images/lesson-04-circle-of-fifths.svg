<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
 <title id="title">Circle of fifths with key signatures and relative minor keys</title><desc id="desc">Clockwise from C, major keys progress by fifths and add sharps. Counterclockwise they progress by fourths and add flats. Each major key shares its signature with the relative minor shown beneath it.</desc>
 <rect width="840" height="560" rx="20" fill="#fbf7ee"/><text x="420" y="31" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="17" font-weight="700">CIRCLE OF FIFTHS · MAJOR KEYS AND RELATIVE MINORS</text>
 <circle cx="420" cy="290" r="202" fill="none" stroke="#d8cebd" stroke-width="2" stroke-dasharray="4 5"/>
 <g fill="#fffdf8" stroke="#b9ad98" stroke-width="1.5" font-family="Arial,sans-serif" text-anchor="middle">
  <circle cx="420" cy="78" r="42"/><circle cx="526" cy="106" r="42"/><circle cx="597" cy="184" r="42"/><circle cx="624" cy="290" r="42"/><circle cx="597" cy="396" r="42"/><circle cx="526" cy="474" r="42"/><circle cx="420" cy="502" r="42"/><circle cx="314" cy="474" r="42"/><circle cx="243" cy="396" r="42"/><circle cx="216" cy="290" r="42"/><circle cx="243" cy="184" r="42"/><circle cx="314" cy="106" r="42"/>
 </g>
 <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#544c40" font-size="17" font-weight="700">
  <text x="420" y="73">C</text><text x="526" y="101">G</text><text x="597" y="179">D</text><text x="624" y="285">A</text><text x="597" y="391">E</text><text x="526" y="469">B</text><text x="420" y="497" font-size="14">F♯ / G♭</text><text x="314" y="469">D♭</text><text x="243" y="391">A♭</text><text x="216" y="285">E♭</text><text x="243" y="179">B♭</text><text x="314" y="101">F</text>
 </g><g fill="#b23a26" font-size="10" font-weight="700">
  <text x="420" y="90">0</text><text x="526" y="118">1♯</text><text x="597" y="196">2♯</text><text x="624" y="302">3♯</text><text x="597" y="408">4♯</text><text x="526" y="486">5♯</text><text x="420" y="514">6♯ / 6♭</text><text x="314" y="486">5♭</text><text x="243" y="408">4♭</text><text x="216" y="302">3♭</text><text x="243" y="196">2♭</text><text x="314" y="118">1♭</text>
 </g><g fill="#4e7164" font-size="10"><text x="420" y="105">Am</text><text x="526" y="133">Em</text><text x="597" y="211">Bm</text><text x="624" y="317">F♯m</text><text x="597" y="423">C♯m</text><text x="526" y="501">G♯m</text><text x="420" y="529">D♯m / E♭m</text><text x="314" y="501">B♭m</text><text x="243" y="423">Fm</text><text x="216" y="317">Cm</text><text x="243" y="211">Gm</text><text x="314" y="133">Dm</text></g></g>
 <text x="420" y="265" text-anchor="middle" fill="#b23a26" font-family="Arial,sans-serif" font-size="15" font-weight="700">CLOCKWISE</text><text x="420" y="288" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="13">+1 fifth · +1 sharp</text><text x="420" y="311" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="13">COUNTERCLOCKWISE</text><text x="420" y="334" text-anchor="middle" fill="#4e7164" font-family="Arial,sans-serif" font-size="13">+1 fourth · +1 flat</text>
 </svg>
