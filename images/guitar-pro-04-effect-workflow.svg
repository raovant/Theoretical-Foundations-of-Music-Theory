<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" role="img" aria-labelledby="title desc">
 <title id="title">Apply and check a playing effect in Guitar Pro</title><desc id="desc">Select a note or range, choose an articulation in the editing palette, set any needed details, and listen back to confirm it sounds right.</desc>
 <rect width="840" height="230" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">ADD AN ARTICULATION · THEN CHECK IT BY EAR</text>
 <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fffdf8" stroke="#d8cebd" stroke-width="2"><rect x="50" y="72" width="165" height="86" rx="13"/><rect x="242" y="72" width="165" height="86" rx="13"/><rect x="434" y="72" width="165" height="86" rx="13"/><rect x="626" y="72" width="165" height="86" rx="13"/></g><g fill="#b23a26" font-size="13" font-weight="700"><text x="132" y="103">1 · SELECT</text><text x="324" y="103">2 · CHOOSE</text><text x="516" y="103">3 · APPLY</text><text x="708" y="103">4 · LISTEN</text></g><g fill="#544c40" font-size="12"><text x="132" y="132">note / range</text><text x="324" y="132">palette symbol</text><text x="516" y="132">bend / slide…</text><text x="708" y="132">play the phrase</text></g></g>
 <g stroke="#87643c" stroke-width="3" fill="none"><path d="M217 115h22M409 115h22M601 115h22"/><path d="m229 107 11 8-11 8M421 107l11 8-11 8M613 107l11 8-11 8"/></g>
 <text x="420" y="199" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">The symbol describes the performance; the sound also depends on the selected instrument patch.</text>
