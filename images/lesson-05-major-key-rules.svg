<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" role="img" aria-labelledby="title desc">
 <title id="title">Find a major key from its key signature</title><desc id="desc">For sharp signatures, move one semitone above the last sharp. For flat signatures with at least two flats, the penultimate flat names the major key; one flat is B flat major.</desc>
 <rect width="840" height="310" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">FIND THE MAJOR KEY</text>
 <rect x="45" y="60" width="750" height="100" rx="13" fill="#fffdf8" stroke="#d8cebd"/><rect x="45" y="176" width="750" height="100" rx="13" fill="#fffdf8" stroke="#d8cebd"/>
 <g font-family="Arial,sans-serif"><text x="75" y="91" fill="#b23a26" font-size="15" font-weight="700">SHARPS</text><text x="75" y="129" fill="#544c40" font-size="14">3 sharps: F♯ · C♯ · G♯</text><text x="360" y="121" fill="#8b8272" font-size="13">last sharp</text><text x="465" y="121" fill="#544c40" font-size="17" font-weight="700">G♯</text><path d="M505 111H590" stroke="#b23a26" stroke-width="2.5"/><path d="m580 104 11 7-11 7" fill="none" stroke="#b23a26" stroke-width="2.5"/><text x="625" y="121" fill="#544c40" font-size="17" font-weight="700">A major</text><text x="704" y="121" fill="#8b8272" font-size="12">+ 1 semitone</text>
 <text x="75" y="207" fill="#4e7164" font-size="15" font-weight="700">FLATS</text><text x="75" y="245" fill="#544c40" font-size="14">4 flats: B♭ · E♭ · A♭ · D♭</text><text x="360" y="237" fill="#8b8272" font-size="13">penultimate</text><text x="465" y="237" fill="#544c40" font-size="17" font-weight="700">A♭</text><path d="M505 227H590" stroke="#4e7164" stroke-width="2.5"/><path d="m580 220 11 7-11 7" fill="none" stroke="#4e7164" stroke-width="2.5"/><text x="625" y="237" fill="#544c40" font-size="17" font-weight="700">A♭ major</text></g>
 <text x="420" y="298" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">Exception: one flat means B♭ major · no sharps or flats means C major</text>
</svg>
