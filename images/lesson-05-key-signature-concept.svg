<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="title desc">
 <title id="title">A key signature sharp applies to the same note in every octave</title><desc id="desc">A one-sharp key signature places F sharp on the staff; later F notes in different octaves are also sharp by default.</desc>
 <rect width="840" height="270" rx="18" fill="#fbf7ee"/><text x="420" y="32" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">ONE SHARP IN THE KEY SIGNATURE</text>
 <g stroke="#b9ad98" stroke-width="2"><path d="M100 72H740M100 90H740M100 108H740M100 126H740M100 144H740"/></g>
 <text x="420" y="57" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">treble staff · F♯ is placed on the top line</text>
 <text x="174" y="97" text-anchor="middle" fill="#b23a26" font-family="Arial,sans-serif" font-size="50" font-weight="700">♯</text>
 <g fill="#544c40"><ellipse cx="352" cy="72" rx="14" ry="9" transform="rotate(-18 352 72)"/><ellipse cx="560" cy="135" rx="14" ry="9" transform="rotate(-18 560 135)"/></g>
 <g fill="none" stroke="#b23a26" stroke-width="2"><circle cx="352" cy="72" r="22"/><circle cx="560" cy="135" r="22"/></g>
 <g font-family="Arial,sans-serif" text-anchor="middle"><text x="352" y="190" fill="#b23a26" font-size="15" font-weight="700">F5</text><text x="560" y="190" fill="#b23a26" font-size="15" font-weight="700">F4</text><text x="420" y="231" fill="#8b8272" font-size="13">The key signature changes every F throughout the piece, in every octave.</text></g>
</svg>
