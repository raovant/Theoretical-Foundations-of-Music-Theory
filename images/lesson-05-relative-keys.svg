<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="title desc">
 <title id="title">Relative major and minor share a key signature</title><desc id="desc">G major and E minor share one sharp, F sharp. Their notes are the same, but their tonal centers differ.</desc>
 <rect width="840" height="270" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">ONE KEY SIGNATURE · TWO TONAL CENTERS</text>
 <rect x="65" y="70" width="280" height="135" rx="15" fill="#fffdf8" stroke="#d8cebd"/><rect x="495" y="70" width="280" height="135" rx="15" fill="#fffdf8" stroke="#d8cebd"/>
 <circle cx="420" cy="133" r="39" fill="#f1e3d2" stroke="#b23a26" stroke-width="2"/><path d="M365 133H380M460 133H475" stroke="#b23a26" stroke-width="3"/><path d="m374 126 10 7-10 7M466 126l-10 7 10 7" fill="none" stroke="#b23a26" stroke-width="2"/>
 <g font-family="Arial,sans-serif" text-anchor="middle"><text x="205" y="112" fill="#544c40" font-size="20" font-weight="700">G major</text><text x="205" y="143" fill="#8b8272" font-size="14">G A B C D E F♯</text><text x="205" y="179" fill="#b23a26" font-size="13" font-weight="700">tonic: G</text><text x="635" y="112" fill="#544c40" font-size="20" font-weight="700">E minor</text><text x="635" y="143" fill="#8b8272" font-size="14">E F♯ G A B C D</text><text x="635" y="179" fill="#4e7164" font-size="13" font-weight="700">tonic: E</text><text x="420" y="127" fill="#544c40" font-size="14" font-weight="700">1♯</text><text x="420" y="147" fill="#544c40" font-size="12">F♯</text><text x="420" y="237" fill="#8b8272" font-size="13">Same notes and key signature · different tonal center</text></g>
</svg>
