<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-labelledby="title desc">
 <title id="title">Major scale pattern on a piano keyboard</title><desc id="desc">The C major scale follows whole, whole, half, whole, whole, whole, half steps from C to C.</desc>
 <rect width="840" height="260" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">C MAJOR · WHOLE AND HALF STEPS</text>
 <g transform="translate(90 65)" stroke="#b9ad98" stroke-width="2"><g fill="#fffdf8"><rect x="0" y="0" width="90" height="92"/><rect x="90" y="0" width="90" height="92"/><rect x="180" y="0" width="90" height="92"/><rect x="270" y="0" width="90" height="92"/><rect x="360" y="0" width="90" height="92"/><rect x="450" y="0" width="90" height="92"/><rect x="540" y="0" width="90" height="92"/><rect x="630" y="0" width="90" height="92"/></g>
 <g fill="#b23a26" stroke="none"><circle cx="45" cy="58" r="8"/><circle cx="135" cy="58" r="8"/><circle cx="225" cy="58" r="8"/><circle cx="315" cy="58" r="8"/><circle cx="405" cy="58" r="8"/><circle cx="495" cy="58" r="8"/><circle cx="585" cy="58" r="8"/><circle cx="675" cy="58" r="8"/></g>
 <g fill="#544c40" stroke="none" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="45" y="84">C</text><text x="135" y="84">D</text><text x="225" y="84">E</text><text x="315" y="84">F</text><text x="405" y="84">G</text><text x="495" y="84">A</text><text x="585" y="84">B</text><text x="675" y="84">C</text></g></g>
 <g font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="180" y="190" fill="#87643c">W</text><text x="270" y="190" fill="#87643c">W</text><text x="360" y="190" fill="#b23a26">H</text><text x="450" y="190" fill="#87643c">W</text><text x="540" y="190" fill="#87643c">W</text><text x="630" y="190" fill="#87643c">W</text><text x="720" y="190" fill="#b23a26">H</text></g>
 <text x="420" y="230" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="13">W–W–H–W–W–W–H · W = ۲ semitones · H = ۱ semitone</text>
</svg>
