<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="title desc">
 <title id="title">Set up a guitar track and standard tuning</title><desc id="desc">A track setup includes instrument, tuning, notation display, and sound. Standard guitar tuning from the lowest string to the highest is E2 A2 D3 G3 B3 E4.</desc>
 <rect width="840" height="300" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">TRACK SETUP · CHOOSE THE INSTRUMENT BEFORE WRITING</text>
 <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="70" width="155" height="76" rx="12" fill="#fffdf8" stroke="#d8cebd"/><rect x="242" y="70" width="155" height="76" rx="12" fill="#fffdf8" stroke="#d8cebd"/><rect x="429" y="70" width="155" height="76" rx="12" fill="#fffdf8" stroke="#d8cebd"/><rect x="616" y="70" width="170" height="76" rx="12" fill="#fffdf8" stroke="#d8cebd"/>
 <g fill="#b23a26" font-size="13" font-weight="700"><text x="132" y="100">INSTRUMENT</text><text x="319" y="100">TUNING</text><text x="506" y="100">NOTATION</text><text x="701" y="100">SOUND</text></g><g fill="#544c40" font-size="12"><text x="132" y="126">Electric guitar</text><text x="319" y="126">Standard / Drop D</text><text x="506" y="126">TAB + standard</text><text x="701" y="126">Clean / driven</text></g></g>
 <text x="420" y="181" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">STANDARD GUITAR TUNING · LOWEST STRING TO HIGHEST</text>
 <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700"><g fill="#fffdf8" stroke="#b9ad98" stroke-width="1.5"><rect x="123" y="201" width="86" height="54" rx="9"/><rect x="221" y="201" width="86" height="54" rx="9"/><rect x="319" y="201" width="86" height="54" rx="9"/><rect x="417" y="201" width="86" height="54" rx="9"/><rect x="515" y="201" width="86" height="54" rx="9"/><rect x="613" y="201" width="86" height="54" rx="9"/></g><g fill="#544c40" font-size="18"><text x="166" y="225">E₂</text><text x="264" y="225">A₂</text><text x="362" y="225">D₃</text><text x="460" y="225">G₃</text><text x="558" y="225">B₃</text><text x="656" y="225">E₄</text></g><g fill="#8b8272" font-size="10"><text x="166" y="243">6th</text><text x="264" y="243">5th</text><text x="362" y="243">4th</text><text x="460" y="243">3rd</text><text x="558" y="243">2nd</text><text x="656" y="243">1st</text></g></g>
 <text x="420" y="282" text-anchor="middle" fill="#4e7164" font-family="Arial,sans-serif" font-size="12" font-weight="700">Tuning changes pitch-to-fret mapping; confirm it before entering notes.</text>
</svg>
