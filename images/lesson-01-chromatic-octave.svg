<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" role="img" aria-labelledby="title desc">
  <title id="title">One chromatic octave on a piano keyboard</title>
  <desc id="desc">Seven natural notes and five accidental notes between C and the next C. E to F and B to C are adjacent semitones with no black key between them.</desc>
  <rect width="840" height="250" rx="18" fill="#fbf7ee"/>
  <text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">ONE OCTAVE · 12 SEMITONES</text>
  <g transform="translate(65 62)">
    <g fill="#fffdf8" stroke="#b9ad98" stroke-width="2">
      <rect x="0" y="0" width="100" height="130"/><rect x="100" y="0" width="100" height="130"/>
      <rect x="200" y="0" width="100" height="130"/><rect x="300" y="0" width="100" height="130"/>
      <rect x="400" y="0" width="100" height="130"/><rect x="500" y="0" width="100" height="130"/>
      <rect x="600" y="0" width="100" height="130"/><rect x="700" y="0" width="100" height="130"/>
    </g>
    <g fill="#28231d">
      <rect x="70" y="0" width="60" height="82" rx="0 0 5 5"/><rect x="170" y="0" width="60" height="82" rx="0 0 5 5"/>
      <rect x="370" y="0" width="60" height="82" rx="0 0 5 5"/><rect x="470" y="0" width="60" height="82" rx="0 0 5 5"/><rect x="570" y="0" width="60" height="82" rx="0 0 5 5"/>
    </g>
    <g fill="#fffdf8" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      <text x="100" y="68">C♯ / D♭</text><text x="200" y="68">D♯ / E♭</text><text x="400" y="68">F♯ / G♭</text><text x="500" y="68">G♯ / A♭</text><text x="600" y="68">A♯ / B♭</text>
    </g>
    <g fill="#544c40" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">
      <text x="50" y="113">C</text><text x="150" y="113">D</text><text x="250" y="113">E</text><text x="350" y="113">F</text><text x="450" y="113">G</text><text x="550" y="113">A</text><text x="650" y="113">B</text><text x="750" y="113">C</text>
    </g>
    <g stroke="#b23a26" stroke-width="3" fill="none"><path d="M250 138v13h100v-13"/><path d="M650 138v13h100v-13"/></g>
    <g fill="#962e1e" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="300" y="169">E–F · 1 semitone</text><text x="700" y="169">B–C · 1 semitone</text></g>
  </g>
  <text x="420" y="232" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">White keys: natural notes · Black keys: notes between them</text>
</svg>
