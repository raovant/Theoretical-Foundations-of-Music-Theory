 <rect x="55" y="54" width="730" height="294" rx="14" fill="#fffdf8" stroke="#b9ad98" stroke-width="2"/>
 <rect x="56" y="55" width="728" height="37" rx="12" fill="#e9e3d7"/><text x="420" y="79" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="13" font-weight="700">TOOLBAR + PLAYBACK CONTROLS</text>
 <rect x="56" y="92" width="728" height="27" fill="#f3eee4"/><text x="420" y="111" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="11">OPEN SCORE TABS</text>
