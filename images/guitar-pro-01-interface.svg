<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-labelledby="title desc">
 <title id="title">Schematic overview of the Guitar Pro 8 interface</title><desc id="desc">The main window has a toolbar and tab bar on top, editing palette on the left, score workspace in the center, inspector on the right, and global track view below.</desc>
