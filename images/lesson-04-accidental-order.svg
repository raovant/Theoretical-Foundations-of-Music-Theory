<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" role="img" aria-labelledby="title desc">
 <title id="title">Fixed order of sharps and flats in key signatures</title><desc id="desc">Sharps appear in the order F C G D A E B. Flats appear in reverse order B E A D G C F.</desc>
 <rect width="840" height="240" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">THE ACCIDENTAL ORDER NEVER CHANGES</text>
 <g font-family="Arial,sans-serif" text-anchor="middle"><text x="97" y="102" fill="#b23a26" font-size="15" font-weight="700">SHARPS</text><text x="97" y="177" fill="#4e7164" font-size="15" font-weight="700">FLATS</text></g>
 <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" font-size="18"><g fill="#fffdf8" stroke="#d8cebd"><rect x="180" y="70" width="64" height="48" rx="9"/><rect x="253" y="70" width="64" height="48" rx="9"/><rect x="326" y="70" width="64" height="48" rx="9"/><rect x="399" y="70" width="64" height="48" rx="9"/><rect x="472" y="70" width="64" height="48" rx="9"/><rect x="545" y="70" width="64" height="48" rx="9"/><rect x="618" y="70" width="64" height="48" rx="9"/>
 <rect x="180" y="145" width="64" height="48" rx="9"/><rect x="253" y="145" width="64" height="48" rx="9"/><rect x="326" y="145" width="64" height="48" rx="9"/><rect x="399" y="145" width="64" height="48" rx="9"/><rect x="472" y="145" width="64" height="48" rx="9"/><rect x="545" y="145" width="64" height="48" rx="9"/><rect x="618" y="145" width="64" height="48" rx="9"/></g>
 <g fill="#b23a26"><text x="212" y="100">F♯</text><text x="285" y="100">C♯</text><text x="358" y="100">G♯</text><text x="431" y="100">D♯</text><text x="504" y="100">A♯</text><text x="577" y="100">E♯</text><text x="650" y="100">B♯</text></g>
 <g fill="#4e7164"><text x="212" y="175">B♭</text><text x="285" y="175">E♭</text><text x="358" y="175">A♭</text><text x="431" y="175">D♭</text><text x="504" y="175">G♭</text><text x="577" y="175">C♭</text><text x="650" y="175">F♭</text></g></g>
 <text x="420" y="220" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">Add them from left to right; the flat sequence reverses the sharp order.</text>
</svg>
