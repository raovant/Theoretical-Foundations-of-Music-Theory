<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 285" role="img" aria-labelledby="title desc">
 <title id="title">Synchronize an audio track with score measures</title><desc id="desc">Place sync points along an imported audio waveform at score bar lines so playback follows the recording tempo.</desc>
 <rect width="840" height="285" rx="18" fill="#fbf7ee"/><text x="420" y="34" text-anchor="middle" fill="#544c40" font-family="Arial,sans-serif" font-size="16" font-weight="700">GP8 AUDIO TRACK · MATCH SYNC POINTS TO BAR LINES</text>
 <rect x="60" y="61" width="720" height="93" rx="12" fill="#fffdf8" stroke="#d8cebd"/><path d="M80 107h26l8-28 11 58 15-42 14 26 10-37 12 48 15-25h20l12-33 12 54 14-41 15 25 12-30 13 49 16-24h24l11-37 12 58 12-34 13 24 12-45 13 57 14-23h27l12-33 13 54 12-40 13 24 11-31 14 49 14-23h30l11-38 13 60 13-35 13 25 12-30 14 45" fill="none" stroke="#4e7164" stroke-width="3" stroke-linejoin="round"/>
 <g stroke="#b23a26" stroke-width="2" stroke-dasharray="5 5"><path d="M100 55V220"/><path d="M268 55V220"/><path d="M436 55V220"/><path d="M604 55V220"/><path d="M772 55V220"/></g><g fill="#b23a26"><circle cx="100" cy="107" r="6"/><circle cx="268" cy="107" r="6"/><circle cx="436" cy="107" r="6"/><circle cx="604" cy="107" r="6"/><circle cx="772" cy="107" r="6"/></g>
 <g font-family="Arial,sans-serif" text-anchor="middle" fill="#544c40" font-size="12" font-weight="700"><text x="100" y="199">BAR 1</text><text x="268" y="199">BAR 2</text><text x="436" y="199">BAR 3</text><text x="604" y="199">BAR 4</text><text x="772" y="199">BAR 5</text></g>
 <text x="420" y="251" text-anchor="middle" fill="#8b8272" font-family="Arial,sans-serif" font-size="12">Sync points align the recording and score when the performance tempo moves.</text>
</svg>
